<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>KalaSetu - Discover</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Navigation -->
    <nav>
        <a href="index.html">KalaSetu</a>

        <div>
            <a href="index.html">Home</a>
            <a href="discover.html">Discover</a>

            <span>
                Art Coins:
                <strong id="art-coins">0</strong>
            </span>
        </div>
    </nav>


    <!-- Discover -->
    <main>

        <h1>Discover Art</h1>

        <p>
            Tell us what kind of art you're looking for.
        </p>


        <!-- Search -->
        <section id="discover-section">

            <input
                type="text"
                id="discover-search-input"
                placeholder="Try: peaceful, festive, traditional..."
            >

            <button id="discover-search-button">
                Discover
            </button>

        </section>


        <!-- Results -->
        <section>

            <h2>Artwork Results</h2>

            <div id="discover-results">
                <p>Search for an artwork to begin.</p>
            </div>

        </section>

    </main>


    <script src="js/discover.js"></script>

</body>

</html>
